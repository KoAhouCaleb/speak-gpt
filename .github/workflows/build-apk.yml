name: Build APK

on:
  push:
    branches:
      - claude/app-feature-additions-4ltaoq
  workflow_dispatch:

# A newer push makes an older, still running build obsolete
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Caches are only written on the default branch unless this is disabled
          cache-read-only: false

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: speakgpt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
