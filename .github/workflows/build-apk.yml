name: Build APK

on:
  push:
    branches:
      - main
      - flutter-main
      - claude/flutter-main-69c3f7
  pull_request:
  workflow_dispatch:

# A newer push makes an older, still running build obsolete
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable
          cache: true

      # A fixed debug key lets new builds install as updates over old ones.
      # Flutter signs debug builds with ~/.android/debug.keystore.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, the APK is signed with a random debug key"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d '[:space:]%' | base64 -d > "$HOME/.android/debug.keystore"; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: grace-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
