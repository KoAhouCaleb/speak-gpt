name: Build APK

on:
  push:
    branches:
      - claude/app-feature-additions-4ltaoq
      - claude/tool-calling-implementation-2syg9t
      - claude/tts-streaming-queue-a6fo7v
  workflow_dispatch:

# A newer push makes an older, still running build obsolete
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Caches are only written on the default branch unless this is disabled
          cache-read-only: false

      # A fixed debug key lets new builds install as updates over old ones.
      # Without it, Gradle generates a random key on every fresh runner.
      # app/build.gradle signs debug builds with the file in DEBUG_KEYSTORE_FILE.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, the APK is signed with a random debug key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/debug.keystore"
          # Accept certutil output (BEGIN/END lines) and Windows line endings
          if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \t\r\n' | base64 -d > "$keystore"; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 debug.keystore (Linux), base64 -i debug.keystore (macOS) or [Convert]::ToBase64String([IO.File]::ReadAllBytes('debug.keystore')) (PowerShell)"
            exit 1
          fi
          # Standard Android debug keystore: password "android", alias "androiddebugkey"
          if ! keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"; then
            echo "::error::The decoded keystore can not be opened as an Android debug keystore (password android, alias androiddebugkey)"
            exit 1
          fi
          echo "DEBUG_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache assembleDebug

      - name: Print signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: speakgpt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
